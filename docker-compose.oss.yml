services:
  ollama:
    image: ollama/ollama:latest
    container_name: claudefree-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  model-init:
    image: ollama/ollama:latest
    container_name: claudefree-ollama-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen3-coder:30b"]
    volumes:
      - ollama_models:/root/.ollama
    restart: "no"

volumes:
  ollama_models:
